name: build

on:
  push:
    branches:
      - "4.x-gpg"
    tags:
      - "4.*"
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # tiredofit/alpine is no longer published, so the base image is built from source and kept in GHCR
  BASE_REF: "7.10.31"
  ALPINE_VERSION: "3.21"
  ZABBIX_VERSION: "7.0.13"
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/${owner}/db-backup-base:${ALPINE_VERSION}-${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/db-backup" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for base image
        id: base
        run: |
          if docker buildx imagetools inspect "${{ steps.names.outputs.base }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base image source
        if: steps.base.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: tiredofit/docker-alpine
          ref: ${{ env.BASE_REF }}
          path: .base

      - name: Patch base image source
        if: steps.base.outputs.exists != 'true'
        run: ./scripts/patch-base-image.sh .base

      - name: Build base image
        if: steps.base.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .base
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            ZABBIX_VERSION=${{ env.ZABBIX_VERSION }}
          push: true
          tags: ${{ steps.names.outputs.base }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build db-backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          build-args: BASE_IMAGE=${{ steps.names.outputs.base }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
